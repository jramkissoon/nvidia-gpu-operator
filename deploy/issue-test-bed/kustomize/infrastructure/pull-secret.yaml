# The fake chart hardcodes imagePullSecrets: gcr-secret with no way to turn it
# off. Its images are public, so an empty secret just silences the kubelet's
# FailedToRetrieveImagePullSecret warning on every pull.
---
{
  apiVersion: "v1",
  kind: "Secret",
  metadata: {
    name: "gcr-secret",
  },
  type: "kubernetes.io/dockerconfigjson",
  data: {
    .dockerconfigjson: "eyJhdXRocyI6e319",
  },
}
