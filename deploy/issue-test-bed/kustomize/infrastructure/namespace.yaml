---
{
  apiVersion: "v1",
  kind: "Namespace",
  metadata: {
    name: "gpu-operator",
    # Both operators run privileged DaemonSets (fake device-plugin, DRA
    # kubelet-plugin, nvml-mock), so relax Pod Security Admission here.
    labels: {
      pod-security.kubernetes.io/enforce: "privileged",
      pod-security.kubernetes.io/audit: "privileged",
      pod-security.kubernetes.io/warn: "privileged",
    },
  },
}
