# Everything the test bed needs before a GPUCluster can be applied: the
# namespace, the gpu-operator from this worktree, and the fake GPU operator.
# Render with: kustomize build --enable-helm --load-restrictor LoadRestrictionsNone
# (the gpu-operator chart lives outside this directory tree).
---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  # Set here, not in the children: kustomize does not add a namespace to
  # resources generated by helmCharts in the same kustomization, but it does
  # once they arrive here as plain resources.
  namespace: "gpu-operator",
  resources: [
    "namespace.yaml",
    "pull-secret.yaml",
    "gpu-operator",
    "fake-gpu-operator",
  ],
  # Release vs local operator image, applied over the chart's pin.
  components: [
    "../components/operator-image",
  ],
}
