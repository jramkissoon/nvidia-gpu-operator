# Baseline GPUCluster: DRA driver with the gpus capability only.
# The CR is cluster-scoped and must be named gpu-cluster (CEL singleton rule).
---
{
  apiVersion: "nvidia.com/v1alpha1",
  kind: "GPUCluster",
  metadata: {
    name: "gpu-cluster",
  },
  spec: {
    draDriver: {
      repository: "nvcr.io/nvidia",
      image: "dra-driver-nvidia-gpu",
      version: "v0.5.0",
      imagePullPolicy: "IfNotPresent",
      computeDomains: {
        enabled: false,
      },
    },
    # No real GPUs here, so keep the DCGM stack out of the way.
    dcgm: { enabled: false },
    dcgmExporter: { enabled: false },
    hostPaths: {
      # The fake operator's mock backend installs its driver tree here. Pointing
      # the driver root at it directly sidesteps the race where the kubelet-plugin
      # DaemonSet's hostPath creates /run/nvidia/driver as an empty directory
      # before nvml-mock can place its symlink there.
      driverInstallDir: "/var/lib/nvml-mock/driver",
      kubeletRootDir: "/var/lib/kubelet",
    },
  },
}
