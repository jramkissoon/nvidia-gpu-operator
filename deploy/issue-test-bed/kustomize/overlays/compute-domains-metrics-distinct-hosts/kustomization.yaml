# to a different loopback address.
---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  resources: [
    "../compute-domains-enabled",
  ],
  patches: [{
    path: "gpucluster-patch.yaml",
  }],
}
